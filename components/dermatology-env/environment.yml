# Isolated Python interpreter for the dermatology notebook kernel at
# /opt/dermatology-env. After changing this file, run ./lock.
name: dermatology
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip==26.2.2
  - numpy==2.5.5
  - scipy==1.18.1
  - pandas==3.1.1
  - matplotlib-base==3.11.2
  - seaborn==0.13.2
  - scikit-image==0.26.0
  - scikit-learn==1.9.1
  - statsmodels==0.15.0
  - dask-core==2026.11.0
  - xarray==2026.9.0
  - imageio==2.38.2
  - tifffile==2026.11.16
  - imagecodecs==2026.11.11
  - zarr==3.4.2
  - lxml==6.1.3
  - openslide==4.0.1
  - openslide-python==1.4.7
  - pydicom==3.0.2
  - colour-science==0.4.7
  - trimesh==5.2.2
  # Held on 6.31.0 (matching neuroimaging-env) to keep widget comms off
  # ipykernel 7's experimental subshell execution path.
  - ipykernel==6.31.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
  # Pinned in conda to satisfy botocore/aiobotocore (<3.0.0) without pip
  # overwriting conda-installed packages.
  - python-dateutil==2.9.0.post0
