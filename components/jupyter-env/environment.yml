# The Jupyter server environment at /opt/conda. Users install into it with
# `mamba install`, so it holds only what the image needs to serve notebooks.
#
# After changing this file, regenerate the lockfile: ./lock
name: base
channels:
  - conda-forge
dependencies:
  - python=3.13
  - jupyterlab==4.6.6
  - jupyterhub-singleuser==6.2.0
  - jupyter-server-proxy==4.6.1
  - ipykernel==7.4.0
  - mamba==2.10.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
  - jupyterlab-git==0.55.0
  - jupyter-resource-usage==1.3.0
  - jupyterlab_rise==0.43.1
  - jupyter-scheduler==2.12.1
  - nbgitpuller==1.3.0
  - papermill==2.7.0
  - pytest==9.2.0
  - uv==0.13.9
  # Jupyter AI: the chat panel in JupyterLab, for the coding agents an image
  # has (docs/jupyter-ai.md). No model, key or endpoint comes with it.
  - jupyter-ai==3.2.0
  # Keep shared base versions within ranges required by notebook-intelligence
  # (litellm requires importlib-metadata<9; botocore requires python-dateutil<3).
  - importlib-metadata>=8,<9
  - python-dateutil>=2.8.2,<3
