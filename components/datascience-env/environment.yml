# Isolated Python interpreter for the data science notebook kernel at
# /opt/datascience-env. After changing this file, run ./lock.
name: datascience
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip==26.2.2
  - numpy==2.5.5
  - scipy==1.18.1
  - pandas==3.1.1
  - polars==2.1.0
  - pyarrow==26.0.1
  - python-duckdb==2.0.1
  - scikit-learn==1.9.1
  - statsmodels==0.15.0
  - xgboost==3.4.2
  - lightgbm==4.7.0
  - numba==0.68.1
  - matplotlib-base==3.11.2
  - seaborn==0.13.2
  - plotly==7.1.0
  - altair==6.3.0
  - sqlalchemy==2.1.9
  # Held on 6.31.0 (matching neuroimaging-env) to keep widget comms off
  # ipykernel 7's experimental subshell execution path.
  - ipykernel==6.31.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
