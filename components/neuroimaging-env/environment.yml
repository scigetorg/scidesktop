# Isolated Python interpreter for the neuroimaging notebook kernel at
# /opt/neuroimaging-env. After changing this file, run ./lock.
name: neuroimaging
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip==26.2.2
  - numpy==2.5.5
  - scipy==1.18.1
  - pandas==3.1.1
  - matplotlib-base==3.11.2
  - ipykernel==7.4.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
