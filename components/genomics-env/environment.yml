# Isolated Python interpreter for the genomics and single-cell notebook kernel
# at /opt/genomics-env. After changing this file, run ./lock.
name: genomics
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip==26.2.2
  - numpy==2.5.5
  - scipy==1.18.1
  - pandas==3.1.1
  - polars==2.1.0
  - pyarrow==26.0.1
  - h5py==3.16.0
  - zarr==3.4.2
  - dask-core==2026.11.0
  - xarray==2026.9.0
  - numba==0.68.1
  - scikit-learn==1.9.1
  - statsmodels==0.15.0
  - matplotlib-base==3.11.2
  - seaborn==0.13.2
  - plotly==7.1.0
  - biopython==1.88
  - anndata==0.13.4
  - scanpy==1.13.0
  - mudata==0.4.1
  - python-igraph==1.0.0
  - leidenalg==0.12.0
  - umap-learn==0.6.0
  - pyyaml==6.0.3
  - jsonschema==4.26.0
  # Held on 6.31.0 (matching neuroimaging-env) to keep widget comms off
  # ipykernel 7's experimental subshell execution path.
  - ipykernel==6.31.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
  # Pinned in conda to satisfy botocore (<3.0.0) and nf-core (<=3.0.52) without
  # pip overwriting conda-installed packages.
  - python-dateutil==2.9.0.post0
  - prompt-toolkit==3.0.52
