# Isolated Python interpreter for the preclinical imaging notebook kernel at
# /opt/preclinical-env. After changing this file, run ./lock.
name: preclinical
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip==26.2.2
  - numpy==2.5.5
  - scipy==1.18.1
  - pandas==3.1.1
  - matplotlib-base==3.11.2
  - seaborn==0.13.2
  - scikit-image==0.26.0
  - scikit-learn==1.9.1
  - statsmodels==0.15.0
  - dask-core==2026.11.0
  - xarray==2026.9.0
  - imageio==2.38.2
  - tifffile==2026.11.16
  - zarr==3.4.2
  - lxml==6.1.3
  - pydicom==3.0.2
  - simpleitk==2.5.8
  # Held on 6.31.0 (matching neuroimaging-env) to keep widget comms off
  # ipykernel 7's experimental subshell execution path.
  - ipykernel==6.31.0
  - ipywidgets==8.1.9
  - anywidget==0.11.0
  - ipycanvas==0.14.3
  - python-dateutil==2.9.0.post0
