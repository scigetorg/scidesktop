# The Neurodesk CVMFS repository (https://neurodesk.org): its mirrors and the
# key its content is signed with. Used when CVMFS is mounted inside the
# container (SCIDESKTOP_CVMFS_MODE=internal); a /cvmfs the platform mounts
# brings its own configuration. The client orders the mirrors by distance
# (GeoAPI) and moves to the next when one fails.
CVMFS_USE_GEOAPI=yes
CVMFS_SERVER_URL="http://cvmfs-frankfurt.neurodesk.org/cvmfs/@fqrn@;http://cvmfs-sydney.neurodesk.org/cvmfs/@fqrn@;http://cvmfs-jetstream.neurodesk.org/cvmfs/@fqrn@;http://cvmfs-toronto.neurodesk.org/cvmfs/@fqrn@;http://s1brisbane-cvmfs.openhtc.io/cvmfs/@fqrn@;http://s1nikhef-cvmfs.openhtc.io/cvmfs/@fqrn@"
CVMFS_KEYS_DIR="/etc/cvmfs/keys/ardc.edu.au/"
