---
name: Image build (reusable)

on:
  workflow_call:
    inputs:
      write-cache:
        description: Write BuildKit registry cache tags to GHCR
        type: boolean
        default: false
      push-candidates:
        description: Push per-architecture candidate images to GHCR
        type: boolean
        default: false

env:
  # Must match env.PUBLISH in .github/workflows/image.yml (enforced by test/contract.py S6).
  PUBLISH: scidesktop microdesktop datadesktop dermdesktop preclinicaldesktop moleculardesktop genomicsdesktop neurodesktop
  # Shared BuildKit registry cache package (lowercased in .github/scripts/bake-args).
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/scidesktop-cache
  # This run's images before they are published: <candidate>-<arch>.
  CANDIDATE: run-${{ github.run_id }}

# Permissions are intentionally omitted here so each caller job in image.yml
# controls its own token scope (packages: read for PRs, packages: write for main).

jobs:
  # One runner per architecture, each building its own: no emulation.
  # test/contract.py (S7) keeps this list equal to components/target-arch.
  build:
    name: Build, test and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          cleanup: false

      # Log in to GHCR before building. Caller permissions guarantee that PR
      # jobs only hold packages: read (for reading scidesktop-cache even if
      # private), while main jobs hold packages: write (for writing cache tags
      # and pushing candidates). Fork PRs read anonymously once scidesktop-cache
      # is public (docs/operator-runbook.md).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docs/components.md: the assembly only assembles, one copy of each version,
      # every component has a target and a test.
      - name: Contract (static)
        run: python3 test/contract.py static

      # Which tags the publish job moves, against a registry of the test's own.
      - name: Publish script
        run: ./test/publish-manifests-test.sh

      # Multi-arch mirroring, rolling-tag guards and retry/auth handling for Quay.io.
      - name: Mirror script
        run: ./test/mirror-manifests-test.sh

      - name: Free disk space (amd64)
        if: matrix.arch == 'amd64'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Ephemeral loopback registry on an OS-assigned port (reusing registry:2
      # already cached by the publish/mirror tests above) so BuildKit exports
      # deduplicated layers via type=registry instead of streaming 8 multi-GB
      # type=docker tarballs, and Trivy scans via --image-src remote without
      # docker-save temp tarballs.
      - name: Start local registry
        run: |
          set -euo pipefail
          cid="$(docker run -d --publish 127.0.0.1::5000 registry:2)"
          echo "LOCAL_REGISTRY_CID=${cid}" >> "${GITHUB_ENV}"
          addr="$(docker port "${cid}" 5000/tcp | head -n 1)"
          port="${addr##*:}"
          [ -n "${port}" ] || { echo "Failed to resolve local registry port for ${cid}" >&2; exit 1; }
          endpoint="127.0.0.1:${port}"
          echo "LOCAL_REGISTRY=${endpoint}" >> "${GITHUB_ENV}"
          for _ in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Running}}' "${cid}")" = "true" ] || {
                  echo "Local registry container ${cid} stopped unexpectedly" >&2
                  docker logs "${cid}" >&2 || true
                  exit 1
              }
              curl -fsS --max-time 2 "http://${endpoint}/v2/" >/dev/null && break
              sleep 0.5
          done
          curl -fsS --max-time 2 "http://${endpoint}/v2/" >/dev/null
          echo "Started local registry ${cid} on ${endpoint}"

      # Build every component's test stage and the base image first, push
      # deduplicated layers to the runner-local registry (without default
      # provenance attestation indexes), pull scidesktop once into dockerd,
      # then bake all domain images together and pull their deltas in parallel.
      # Only main runs (inputs.write-cache=true) write GHCR registry cache tags,
      # with separate export modes so `test` writes only `*-test-<arch>` tags
      # and `scidesktop` writes only component + `scidesktop-<arch>` tags.
      - name: Build components, component tests and images
        env:
          PLATFORM: linux/${{ matrix.arch }}
          WRITE_CACHE: ${{ inputs.write-cache }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
        run: |
          # The build's own exit status, not tee's.
          set -euo pipefail
          cache_repo_lc="${CACHE_REPO,,}"
          cache_path="${cache_repo_lc#*/}"
          run_bake() {
              local cache_mode="$1"
              shift
              local args_out=""
              local args=()
              if [ "${cache_mode}" = domain-cache ]; then
                  args_out="$(.github/scripts/bake-args "${{ matrix.arch }}" ci domain-cache "$@")" || return 1
              elif [ "${cache_mode}" = read-cache ]; then
                  args_out="$(.github/scripts/bake-args "${{ matrix.arch }}" ci)" || return 1
              else
                  args_out="$(.github/scripts/bake-args "${{ matrix.arch }}" ci "${cache_mode}")" || return 1
              fi
              mapfile -t args <<<"${args_out}"

              local graph_retried=0 blob_retried=0
              while true; do
                  if docker buildx bake "${args[@]}" "$@" 2>&1 | tee /tmp/bake.log; then
                      return 0
                  fi
                  if [ "${graph_retried}" -eq 0 ] && grep -qE 'inconsistent graph state' /tmp/bake.log; then
                      graph_retried=1
                      echo "::warning::Buildx hit a transient graph-state error; retrying with cache."
                      continue
                  fi
                  # Only retry no-cache on a blob-unknown error attributed to the
                  # configured GHCR cache repository, never local-registry errors.
                  if [ "${blob_retried}" -eq 0 ] && grep -Eiq \
                      "(${cache_repo_lc}|/v2/${cache_path}/blobs/).*blob unknown|blob unknown.*(${cache_repo_lc}|/v2/${cache_path}/blobs/)" \
                      /tmp/bake.log; then
                      blob_retried=1
                      echo "::warning::A registry cache blob vanished during the build; building once more without it."
                      args_out="$(.github/scripts/bake-args "${{ matrix.arch }}" ci no-cache)" || return 1
                      mapfile -t args <<<"${args_out}"
                      continue
                  fi
                  return 1
              done
          }
          test_cache_mode=read-cache
          base_cache_mode=read-cache
          if [ "${WRITE_CACHE}" = true ]; then
              test_cache_mode=write-test-cache
              base_cache_mode=write-cache
          fi

          t0=$SECONDS
          run_bake "${test_cache_mode}" test
          echo "Timing: bake test = $((SECONDS - t0))s"

          t0=$SECONDS
          run_bake "${base_cache_mode}" scidesktop
          echo "Timing: bake scidesktop -> local registry = $((SECONDS - t0))s"

          t0=$SECONDS
          docker pull --quiet "${LOCAL_REGISTRY}/scidesktop:ci"
          docker tag "${LOCAL_REGISTRY}/scidesktop:ci" scidesktop:ci
          echo "Timing: pull scidesktop -> dockerd = $((SECONDS - t0))s"

          domain_images=()
          for dockerfile in images/*/Dockerfile; do
              image="$(basename "$(dirname "${dockerfile}")")"
              [ "${image}" != "scidesktop" ] || continue
              domain_images+=("${image}")
          done

          if [ "${#domain_images[@]}" -gt 0 ]; then
              t0=$SECONDS
              run_bake domain-cache "${domain_images[@]}"
              echo "Timing: bake ${#domain_images[@]} domain images -> local registry = $((SECONDS - t0))s"

              t0=$SECONDS
              max_pull_workers=2
              if [ "${{ matrix.arch }}" = "arm64" ]; then
                  max_pull_workers=3
              fi
              pull_log_dir="$(mktemp -d)"
              declare -A pull_pid_img=()
              # shellcheck disable=SC2317,SC2329
              cleanup_pulls() {
                  local p="" img=""
                  for p in "${!pull_pid_img[@]}"; do
                      pkill -TERM -P "${p}" 2>/dev/null || true
                      kill -TERM "${p}" 2>/dev/null || true
                  done
                  for p in "${!pull_pid_img[@]}"; do
                      wait "${p}" 2>/dev/null || true
                      img="${pull_pid_img[${p}]}"
                      echo "::group::pull ${img} (unfinished)"
                      cat "${pull_log_dir}/${img}.log" 2>/dev/null || true
                      echo "::endgroup::"
                  done
                  rm -rf "${pull_log_dir}"
              }
              trap cleanup_pulls EXIT
              trap 'exit 130' INT
              trap 'exit 143' TERM

              pull_active=0
              pull_failed=0
              reap_pull_one() {
                  local done_pid="" rc=0 p=""
                  wait -n -p done_pid || rc=$?
                  if [ -z "${done_pid:-}" ]; then
                      for p in "${!pull_pid_img[@]}"; do
                          done_pid="${p}"
                          break
                      done
                      rc=0
                      wait "${done_pid}" || rc=$?
                  fi
                  local done_img="${pull_pid_img[${done_pid}]}"
                  unset "pull_pid_img[${done_pid}]"
                  pull_active=$((pull_active - 1))
                  if [ "${rc}" -ne 0 ]; then
                      echo "::group::pull ${done_img} (exit ${rc})"
                      cat "${pull_log_dir}/${done_img}.log" 2>/dev/null || true
                      echo "::endgroup::"
                      pull_failed=1
                  fi
              }
              for image in "${domain_images[@]}"; do
                  while [ "${pull_active}" -ge "${max_pull_workers}" ]; do
                      reap_pull_one
                  done
                  (
                      docker pull --quiet "${LOCAL_REGISTRY}/${image}:ci"
                      docker tag "${LOCAL_REGISTRY}/${image}:ci" "${image}:ci"
                  ) >"${pull_log_dir}/${image}.log" 2>&1 &
                  pid=$!
                  pull_pid_img["${pid}"]="${image}"
                  pull_active=$((pull_active + 1))
              done
              while [ "${pull_active}" -gt 0 ]; do
                  reap_pull_one
              done
              [ "${pull_failed}" -eq 0 ] || exit 1
              echo "Timing: pull ${#domain_images[@]} domain images -> dockerd = $((SECONDS - t0))s"
          fi

          mounts="$(docker logs "${LOCAL_REGISTRY_CID}" 2>&1 | grep -c 'mount=.* 201 ' || true)"
          echo "Local registry cross-repo blob mounts (HTTP 201): ${mounts}"
          df -h /

      # docs/components.md: what each component writes (no overlaps, no shadowing,
      # no permission changes to shared folders, a manifest entry).
      - name: Contract (layers)
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: python3 test/contract.py layers

      # The runner restricts unprivileged user namespaces through AppArmor,
      # which refuses Apptainer's user mapping. Lifting it matches the
      # clusters, whose `notebook` AppArmor profile allows user namespaces.
      #
      # test/image-smoke.sh runs every check an image needs: the components it
      # holds, the base or flavour integrity checks (via contract.py surfaces),
      # notebook/sciget & foreign-UID checks, and the checks of each added
      # component (docs/images.md).
      - name: Smoke test every image
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # Order heaviest images first (LPT scheduling) while still picking up
          # any new folder added under images/.
          images=()
          declare -A seen=()
          for img in datadesktop scidesktop neurodesktop genomicsdesktop; do
              if [ -f "images/${img}/Dockerfile" ]; then
                  images+=("${img}")
                  seen["${img}"]=1
              fi
          done
          for dockerfile in images/*/Dockerfile; do
              img="$(basename "$(dirname "${dockerfile}")")"
              if [ -z "${seen[${img}]:-}" ]; then
                  images+=("${img}")
                  seen["${img}"]=1
              fi
          done

          max_workers=2
          if [ "${{ matrix.arch }}" = "arm64" ]; then
              max_workers=3
          fi
          mem_gb="$(awk '/^MemAvailable:/ { printf "%d", $2 / 1048576 }' /proc/meminfo)"
          mem_cap=$((mem_gb / 5))
          [ "${mem_cap}" -ge 1 ] || mem_cap=1
          if [ "${mem_cap}" -lt "${max_workers}" ]; then
              max_workers="${mem_cap}"
          fi
          # On 4-vCPU amd64 with 2 image workers, overlapping ai-ready-smoke.sh
          # inside datadesktop would stack 3 heavy suites without shortening the
          # 2-worker makespan. Keep it enabled on 8-vCPU arm64 or single-worker runs.
          parallel_ai_ready=1
          if [ "${max_workers}" -gt 1 ] && [ "${{ matrix.arch }}" != "arm64" ]; then
              parallel_ai_ready=0
          elif [ "${mem_gb}" -lt $((max_workers * 5 + 4)) ]; then
              parallel_ai_ready=0
          fi
          echo "Running image smoke tests with concurrency=${max_workers}, parallel_ai_ready=${parallel_ai_ready} (MemAvailable=${mem_gb} GiB)"

          log_dir="$(mktemp -d)"
          declare -A pid_slot=()
          declare -A pid_img=()
          # shellcheck disable=SC2317,SC2329
          cleanup_smoke() {
              local p="" img=""
              for p in "${!pid_img[@]}"; do
                  pkill -TERM -P "${p}" 2>/dev/null || true
                  kill -TERM "${p}" 2>/dev/null || true
              done
              for p in "${!pid_img[@]}"; do
                  wait "${p}" 2>/dev/null || true
                  img="${pid_img[${p}]}"
                  echo "::group::${img} (unfinished)"
                  cat "${log_dir}/${img}.log" 2>/dev/null || true
                  echo "::endgroup::"
              done
              rm -rf "${log_dir}"
          }
          trap cleanup_smoke EXIT INT TERM

          free_slots=()
          for ((s = 0; s < max_workers; s++)); do
              free_slots+=("${s}")
          done

          failed=0
          reap_one() {
              local done_pid="" rc=0 p=""
              wait -n -p done_pid || rc=$?
              # Bash 5.2 can return 127 with done_pid unset if a tracked worker
              # exited via signal while the parent was printing logs. Fall back
              # to an explicit wait on a tracked PID to recover its exit status.
              if [ -z "${done_pid:-}" ]; then
                  for p in "${!pid_img[@]}"; do
                      done_pid="${p}"
                      break
                  done
                  rc=0
                  wait "${done_pid}" || rc=$?
              fi
              local slot="${pid_slot[${done_pid}]}"
              local done_img="${pid_img[${done_pid}]}"
              unset "pid_slot[${done_pid}]" "pid_img[${done_pid}]"
              free_slots+=("${slot}")
              echo "::group::${done_img} (exit ${rc})"
              cat "${log_dir}/${done_img}.log"
              echo "::endgroup::"
              if [ "${rc}" -ne 0 ]; then
                  failed=1
              fi
          }

          for image in "${images[@]}"; do
              while [ "${#free_slots[@]}" -eq 0 ]; do
                  reap_one
              done
              slot="${free_slots[0]}"
              free_slots=("${free_slots[@]:1}")
              base_port=$((18100 + slot * 10))
              (
                  export SMOKE_PORT="${base_port}"
                  export SMOKE_SINGLEUSER_PORT="$((base_port + 1))"
                  export SMOKE_TILE_PORT="$((base_port + 2))"
                  export SMOKE_AI_READY_PORT="$((base_port + 3))"
                  export SMOKE_PARALLEL_AI_READY="${parallel_ai_ready}"
                  ./test/image-smoke.sh "${image}" "${image}:ci"
              ) >"${log_dir}/${image}.log" 2>&1 &
              pid=$!
              pid_slot["${pid}"]="${slot}"
              pid_img["${pid}"]="${image}"
          done

          while [ "${#pid_slot[@]}" -gt 0 ]; do
              reap_one
          done
          exit "${failed}"

      # Real headless Chrome + SwiftShader WebGL2 check of JupyterLab, NiiVue,
      # FreeBrowse, RISE slides, Jupyter AI Chat personas, T3 Code, VS Code,
      # and (on neurodesktop) ipyniivue widgets.
      - name: Browser & WebGL2 smoke (amd64)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          max_workers=2
          log_dir="$(mktemp -d)"
          declare -A pid_slot=()
          declare -A pid_img=()
          # shellcheck disable=SC2317,SC2329
          cleanup_browser() {
              local p="" img=""
              for p in "${!pid_img[@]}"; do
                  pkill -TERM -P "${p}" 2>/dev/null || true
                  kill -TERM "${p}" 2>/dev/null || true
              done
              for p in "${!pid_img[@]}"; do
                  wait "${p}" 2>/dev/null || true
                  img="${pid_img[${p}]}"
                  echo "::group::browser-smoke ${img} (unfinished)"
                  cat "${log_dir}/${img}.log" 2>/dev/null || true
                  echo "::endgroup::"
              done
              rm -rf "${log_dir}"
          }
          trap cleanup_browser EXIT INT TERM

          free_slots=()
          for ((s = 0; s < max_workers; s++)); do
              free_slots+=("${s}")
          done

          failed=0
          reap_one() {
              local done_pid="" rc=0 p=""
              wait -n -p done_pid || rc=$?
              if [ -z "${done_pid:-}" ]; then
                  for p in "${!pid_img[@]}"; do
                      done_pid="${p}"
                      break
                  done
                  rc=0
                  wait "${done_pid}" || rc=$?
              fi
              local slot="${pid_slot[${done_pid}]}"
              local done_img="${pid_img[${done_pid}]}"
              unset "pid_slot[${done_pid}]" "pid_img[${done_pid}]"
              free_slots+=("${slot}")
              echo "::group::browser-smoke ${done_img} (exit ${rc})"
              cat "${log_dir}/${done_img}.log"
              echo "::endgroup::"
              if [ "${rc}" -ne 0 ]; then
                  failed=1
              fi
          }
          # Keep the slot wait in a helper so `for image in ${PUBLISH}; do` has
          # no nested `done` (enforced by test/contract.py S6).
          acquire_slot() {
              while [ "${#free_slots[@]}" -eq 0 ]; do
                  reap_one
              done
          }

          for image in ${PUBLISH}; do
              acquire_slot
              slot="${free_slots[0]}"
              free_slots=("${free_slots[@]:1}")
              (
                  export BROWSER_SMOKE_PORT="$((18200 + slot))"
                  ./test/browser-smoke.sh "${image}:ci"
              ) >"${log_dir}/${image}.log" 2>&1 &
              pid=$!
              pid_slot["${pid}"]="${slot}"
              pid_img["${pid}"]="${image}"
          done

          while [ "${#pid_slot[@]}" -gt 0 ]; do
              reap_one
          done
          exit "${failed}"

      # Vulnerability scan of built images (sequential Trivy pass per image
      # sharing its warmed layer-analysis cache, overlapped with parallel
      # hashed pip-audit workers across all Python environments).
      - name: Vulnerability scan (Trivy & Python pip-audit)
        env:
          PIP_AUDIT_SPECS: >-
            scidesktop:ci:/opt/conda/bin/python
            scidesktop:ci:/opt/selkies/bin/python
            scidesktop:ci:/opt/datalad/bin/python
            scidesktop:ci:/opt/lightcone/bin/python
            scidesktop:ci:/opt/workflow-engines/snakemake/bin/python
            microdesktop:ci:/opt/microscopy-env/bin/python
            datadesktop:ci:/opt/datascience-env/bin/python
            dermdesktop:ci:/opt/dermatology-env/bin/python
            preclinicaldesktop:ci:/opt/preclinical-env/bin/python
            moleculardesktop:ci:/opt/molecular-imaging-env/bin/python
            genomicsdesktop:ci:/opt/genomics-env/bin/python
            datadesktop:ci:/opt/ai-ready/env/bin/python
            datadesktop:ci:/opt/ai-ready/airflow/bin/python
            neurodesktop:ci:/opt/neuroimaging-env/bin/python
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          pip_audit_pid=""
          # shellcheck disable=SC2317,SC2329
          cleanup_scan() {
              if [ -n "${pip_audit_pid}" ]; then
                  pkill -TERM -P "${pip_audit_pid}" 2>/dev/null || true
                  kill -TERM "${pip_audit_pid}" 2>/dev/null || true
                  wait "${pip_audit_pid}" 2>/dev/null || true
                  local idx=0 spec="" img="" py=""
                  for spec in ${PIP_AUDIT_SPECS}; do
                      idx=$((idx + 1))
                      if [ -s "${audit_dir}/log-${idx}.txt" ]; then
                          img="${spec%:*}"
                          py="${spec##*:}"
                          echo "::group::pip-audit ${img} ${py} (unfinished)"
                          cat "${audit_dir}/log-${idx}.txt" || true
                          echo "::endgroup::"
                      fi
                  done
              fi
              rm -rf "${audit_dir}" /tmp/pip-audit-venv /tmp/trivy /tmp/trivy.tar.gz
          }
          trap cleanup_scan EXIT INT TERM

          python3 -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install --quiet --no-deps --require-hashes \
              -r .github/requirements/pip-audit.txt

          # Run pip-audit workers (network-bound, sharing an atomic cache dir)
          # in parallel alongside the sequential Trivy pass below.
          (
              set -euo pipefail
              max_audit_workers=4
              declare -A pid_idx=()
              active=0
              audit_failed=0
              # shellcheck disable=SC2317,SC2329
              cleanup_audit_workers() {
                  local p=""
                  for p in "${!pid_idx[@]}"; do
                      pkill -TERM -P "${p}" 2>/dev/null || true
                      kill -TERM "${p}" 2>/dev/null || true
                  done
                  for p in "${!pid_idx[@]}"; do
                      wait "${p}" 2>/dev/null || true
                  done
                  exit 143
              }
              trap cleanup_audit_workers TERM INT

              reap_audit_one() {
                  local done_pid="" rc=0 p=""
                  wait -n -p done_pid || rc=$?
                  if [ -z "${done_pid:-}" ]; then
                      for p in "${!pid_idx[@]}"; do
                          done_pid="${p}"
                          break
                      done
                      rc=0
                      wait "${done_pid}" || rc=$?
                  fi
                  local done_idx="${pid_idx[${done_pid}]}"
                  unset "pid_idx[${done_pid}]"
                  active=$((active - 1))
                  printf '%s\n' "${rc}" > "${audit_dir}/rc-${done_idx}"
                  if [ "${rc}" -ne 0 ]; then
                      audit_failed=1
                  fi
              }
              # Keep the slot wait in a helper so `for spec in ${PIP_AUDIT_SPECS}; do`
              # has no nested `done` (enforced by test/contract.py S6).
              wait_audit_slot() {
                  while [ "${active}" -ge "${max_audit_workers}" ]; do
                      reap_audit_one
                  done
              }
              idx=0
              for spec in ${PIP_AUDIT_SPECS}; do
                  wait_audit_slot
                  idx=$((idx + 1))
                  img="${spec%:*}"
                  py="${spec##*:}"
                  freeze="${audit_dir}/freeze-${idx}.txt"
                  log="${audit_dir}/log-${idx}.txt"
                  (
                      if docker run --rm --entrypoint "${py}" "${img}" -c \
                          'import importlib.metadata as im; seen = set(); [print(n + "==" + d.version) for d in im.distributions() if (n := d.metadata.get("Name")) and (n.lower(), d.version) not in seen and not seen.add((n.lower(), d.version))]' \
                          > "${freeze}"; then
                          /tmp/pip-audit-venv/bin/pip-audit -r "${freeze}" --cache-dir "${audit_dir}/cache" --no-deps --disable-pip
                      else
                          exit 1
                      fi
                  ) >"${log}" 2>&1 &
                  pid=$!
                  pid_idx["${pid}"]="${idx}"
                  active=$((active + 1))
              done
              while [ "${active}" -gt 0 ]; do
                  reap_audit_one
              done
              exit "${audit_failed}"
          ) &
          pip_audit_pid=$!

          ver="0.76.2"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
              trivy_arch="ARM64"
              sha="ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"
          else
              trivy_arch="64bit"
              sha="bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          fi
          curl -fsSL -o /tmp/trivy.tar.gz \
              "https://github.com/aquasecurity/trivy/releases/download/v${ver}/trivy_${ver}_Linux-${trivy_arch}.tar.gz"
          printf '%s  %s\n' "${sha}" /tmp/trivy.tar.gz | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --download-db-only \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
          failed=0
          for image in ${PUBLISH}; do
              echo "::group::trivy ${image}"
              expected_layers="$(docker image inspect -f '{{json .RootFS.Layers}}' "${image}:ci")"
              trivy_rc=0
              /tmp/trivy image --image-src remote --skip-db-update --list-all-pkgs \
                  --scanners vuln --ignore-unfixed \
                  --format json --output "/tmp/trivy-${image}.json" \
                  "${LOCAL_REGISTRY}/${image}:ci" || trivy_rc=$?
              if [ "${trivy_rc}" -ne 0 ]; then
                  echo "  [FAIL] trivy exited with status ${trivy_rc}"
                  failed=1
              else
                  python3 - "/tmp/trivy-${image}.json" "${expected_layers}" <<'PY' || failed=1
          import json, sys
          data = json.load(open(sys.argv[1]))
          expected_layers = json.loads(sys.argv[2])
          meta = data.get("Metadata") or {}
          diff_ids = meta.get("DiffIDs") or []
          os_family = (meta.get("OS") or {}).get("Family", "")
          results = data.get("Results") or []
          if diff_ids != expected_layers:
              print(f"  [FAIL] Trivy scanned DiffIDs ({len(diff_ids)}) != dockerd image layers ({len(expected_layers)})")
              sys.exit(1)
          os_pkgs_count = sum(
              len(r.get("Packages") or [])
              for r in results
              if r.get("Class") == "os-pkgs"
          )
          if os_family != "ubuntu" or os_pkgs_count == 0:
              print(f"  [FAIL] Trivy did not scan Ubuntu OS packages (OS={os_family!r}, os_pkgs={os_pkgs_count}, classes={[r.get('Class') for r in results]})")
              sys.exit(1)
          os_high_crit, any_crit, lib_high = [], [], []
          for res in results:
              cls = res.get("Class", "")
              tgt = res.get("Target", "")
              for v in res.get("Vulnerabilities") or []:
                  sev = v.get("Severity", "")
                  entry = f"{tgt}: {v.get('PkgName')} {v.get('InstalledVersion')} {v.get('VulnerabilityID')} ({sev}, fix: {v.get('FixedVersion')})"
                  if sev == "CRITICAL":
                      any_crit.append(entry)
                  if cls == "os-pkgs" and sev in ("HIGH", "CRITICAL"):
                      os_high_crit.append(entry)
                  elif cls != "os-pkgs" and sev == "HIGH":
                      lib_high.append(entry)
          print(f"OS packages scanned: {os_pkgs_count} | OS HIGH/CRITICAL: {len(os_high_crit)}, Any CRITICAL: {len(any_crit)}, Library HIGH (informational): {len(lib_high)}")
          for e in lib_high:
              print("  [info]", e)
          for e in os_high_crit + any_crit:
              print("  [FAIL]", e)
          sys.exit(1 if (os_high_crit or any_crit) else 0)
          PY
              fi
              rm -f "/tmp/trivy-${image}.json"
              echo "::endgroup::"
          done

          pip_audit_rc=0
          wait "${pip_audit_pid}" || pip_audit_rc=$?
          pip_audit_pid=""
          if [ "${pip_audit_rc}" -ne 0 ]; then
              failed=1
          fi
          idx=0
          for spec in ${PIP_AUDIT_SPECS}; do
              idx=$((idx + 1))
              img="${spec%:*}"
              py="${spec##*:}"
              rc="$(cat "${audit_dir}/rc-${idx}" 2>/dev/null || echo 1)"
              echo "::group::pip-audit ${img} ${py} (exit ${rc})"
              cat "${audit_dir}/log-${idx}.txt" 2>/dev/null || true
              echo "::endgroup::"
          done
          exit "${failed}"

      # Reclaim the local registry's anonymous volume before candidate pushes
      # (and on early failures).
      - name: Remove local registry
        if: always()
        run: |
          if [ -n "${LOCAL_REGISTRY_CID:-}" ]; then
              docker rm -fv "${LOCAL_REGISTRY_CID}" >/dev/null 2>&1 || true
          fi

      # Pushed under a tag nothing deploys. The publish job gives the images
      # their real tags once every architecture has passed. (Already logged in
      # to GHCR before the build step.)
      - name: Push tested images as candidates
        if: inputs.push-candidates
        run: |
          set -euo pipefail
          push_with_retry() {
              local ref="$1"
              local attempt delay=5
              for attempt in 1 2 3 4; do
                  if docker push "${ref}"; then
                      return 0
                  fi
                  if [ "${attempt}" -eq 4 ]; then
                      echo "::error::Failed to push ${ref} after ${attempt} attempts."
                      return 1
                  fi
                  echo "::warning::docker push ${ref} failed (attempt ${attempt}/4); retrying in ${delay}s..."
                  sleep "${delay}"
                  delay=$((delay * 2))
              done
          }

          # Push scidesktop first so shared base layers are already in GHCR
          # before domain images push concurrently.
          domain_images=()
          for image in ${PUBLISH}; do
              ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${image}:${CANDIDATE}-${{ matrix.arch }}"
              docker tag "${image}:ci" "${ref}"
              if [ "${image}" = "scidesktop" ]; then
                  echo "::group::push ${image}"
                  base_rc=0
                  push_with_retry "${ref}" || base_rc=$?
                  echo "::endgroup::"
                  [ "${base_rc}" -eq 0 ] || exit "${base_rc}"
              else
                  domain_images+=("${image}")
              fi
          done

          max_workers=2
          if [ "${{ matrix.arch }}" = "arm64" ]; then
              max_workers=3
          fi
          log_dir="$(mktemp -d)"
          declare -A pid_img=()
          # shellcheck disable=SC2317,SC2329
          cleanup_push() {
              local p="" img=""
              for p in "${!pid_img[@]}"; do
                  pkill -TERM -P "${p}" 2>/dev/null || true
                  kill -TERM "${p}" 2>/dev/null || true
              done
              for p in "${!pid_img[@]}"; do
                  wait "${p}" 2>/dev/null || true
                  img="${pid_img[${p}]}"
                  echo "::group::push ${img} (unfinished)"
                  cat "${log_dir}/${img}.log" 2>/dev/null || true
                  echo "::endgroup::"
              done
              rm -rf "${log_dir}"
          }
          trap cleanup_push EXIT INT TERM

          active=0
          failed=0
          reap_push_one() {
              local done_pid="" rc=0 p=""
              wait -n -p done_pid || rc=$?
              if [ -z "${done_pid:-}" ]; then
                  for p in "${!pid_img[@]}"; do
                      done_pid="${p}"
                      break
                  done
                  rc=0
                  wait "${done_pid}" || rc=$?
              fi
              local done_img="${pid_img[${done_pid}]}"
              unset "pid_img[${done_pid}]"
              active=$((active - 1))
              echo "::group::push ${done_img} (exit ${rc})"
              cat "${log_dir}/${done_img}.log"
              echo "::endgroup::"
              if [ "${rc}" -ne 0 ]; then
                  failed=1
              fi
          }

          for image in "${domain_images[@]}"; do
              while [ "${active}" -ge "${max_workers}" ]; do
                  reap_push_one
              done
              ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${image}:${CANDIDATE}-${{ matrix.arch }}"
              push_with_retry "${ref}" >"${log_dir}/${image}.log" 2>&1 &
              pid=$!
              pid_img["${pid}"]="${image}"
              active=$((active + 1))
          done

          while [ "${active}" -gt 0 ]; do
              reap_push_one
          done
          exit "${failed}"
