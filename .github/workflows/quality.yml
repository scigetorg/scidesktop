---
name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell, Python and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contract (static)
        run: python3 test/contract.py static

      - name: ShellCheck
        run: |
          mapfile -t scripts < <(
            find components test .github/scripts -type f \( -name '*.sh' -o -perm /111 \) \
              ! -path 'components/startup/rootfs/usr/local/bin/start*' \
              ! -path 'components/startup/rootfs/usr/local/bin/before-notebook.d/10activate*' \
              | xargs -r grep -lE '^#! */(usr/)?bin/(env )?(ba)?sh'
          )
          shellcheck --severity=warning -e SC1090,SC1091 "${scripts[@]}"

      - name: Ruff (Python)
        run: |
          pipx run ruff check --select E9,F63,F7,F82,F401,F841 components test

      - name: Actionlint (workflows)
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp
          /tmp/actionlint
