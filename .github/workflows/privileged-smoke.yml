---
name: Privileged smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read
  packages: read

concurrency:
  group: privileged-smoke
  cancel-in-progress: false

env:
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/scidesktop-cache

jobs:
  apptainer-build:
    name: Apptainer build (amd64, privileged)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Reads the GHCR registry caches the Image workflow writes; does not write its own.
      - name: Build image
        run: |
          mapfile -t args < <(.github/scripts/bake-args amd64 privileged-smoke)
          docker buildx bake "${args[@]}" scidesktop

      - name: Run privileged smoke test
        env:
          SMOKE_BUILD: '1'
        run: ./test/smoke.sh scidesktop:privileged-smoke
