---
name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, smoke and publish (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Buildx reads the GitHub Actions cache token from the environment, which
      # `run` steps do not get by default; without it the gha cache is skipped
      # and every run rebuilds every component.
      - name: Expose the Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # docs/components.md: the assembly only assembles, one copy of each version,
      # every component has a target and a test.
      - name: Contract (static)
        run: python3 test/contract.py static

      # One bake builds every component, runs every component's test stage and loads
      # every image in images/. Each component caches in its own GitHub Actions scope, so
      # an unchanged component is not rebuilt.
      - name: Build components, component tests and image
        env:
          IMAGE: scidesktop:ci
          MICRODESKTOP_IMAGE: microdesktop:ci
        run: |
          args=()
          for t in os-ubuntu micromamba startup jupyter-env selkies apptainer lmod sciget scidesktop microdesktop; do
              args+=(--set "${t}.cache-from=type=gha,scope=${t}"
                     --set "${t}.cache-to=type=gha,scope=${t},mode=max")
          done
          docker buildx bake "${args[@]}" default test

      # docs/components.md: what each component writes (no overlaps, no shadowing,
      # no permission changes to shared folders, a manifest entry).
      - name: Contract (layers)
        run: python3 test/contract.py layers

      # The runner restricts unprivileged user namespaces through AppArmor,
      # which refuses Apptainer's user mapping. Lifting it matches the
      # clusters, whose `notebook` AppArmor profile allows user namespaces.
      - name: Smoke test
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ./test/smoke.sh scidesktop:ci

      - name: Smoke test (microdesktop)
        run: ./test/smoke.sh microdesktop:ci

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%.7s' "${GITHUB_SHA}")"
          docker tag scidesktop:ci "${image}:${short_sha}"
          docker tag scidesktop:ci "${image}:latest"
          docker push "${image}:${short_sha}"
          docker push "${image}:latest"
