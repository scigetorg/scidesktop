---
name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Images pushed to GHCR as ghcr.io/<owner>/<image>. Every folder in images/
  # is built and smoke-tested on every architecture; add a name here to
  # publish it too. Kept equal to _image-build.yml by test/contract.py (S6).
  PUBLISH: scidesktop microdesktop datadesktop dermdesktop preclinicaldesktop moleculardesktop genomicsdesktop neurodesktop
  # This run's images before they are published: <candidate>-<arch>.
  CANDIDATE: run-${{ github.run_id }}

jobs:
  # Pull requests and non-main runs only receive packages: read so untrusted or
  # unmerged code never gets credentials that can overwrite GHCR cache tags or
  # published packages.
  build-pr:
    name: PR
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_image-build.yml
    with:
      write-cache: false
      push-candidates: false

  # Main pushes (and workflow_dispatch on main) receive packages: write to
  # update GHCR build cache tags and push candidate images for publishing.
  build:
    name: Main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image-build.yml
    with:
      write-cache: true
      push-candidates: true

  publish:
    name: Publish multi-arch images
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the candidates and tag them
        run: |
          # shellcheck disable=SC2086
          .github/scripts/publish-manifests "ghcr.io/${GITHUB_REPOSITORY_OWNER}" "${CANDIDATE}" ${PUBLISH}

  attest:
    name: Attest build provenance (${{ matrix.image }})
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [scidesktop, microdesktop, datadesktop, dermdesktop, preclinicaldesktop, moleculardesktop, genomicsdesktop, neurodesktop]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published multi-arch digest
        id: digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          short_sha="$(printf '%.7s' "${SHORT_SHA}")"
          digest="$(docker buildx imagetools inspect "${repo}:${short_sha}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unexpected manifest digest for ${repo}:${short_sha}: '${digest}'" >&2
              exit 1
          fi
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digest.outputs.repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
